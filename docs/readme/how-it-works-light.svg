<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="How it works: add the repo, open your agent, hand it the APK, watch and export">
  <defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(20,20,20,0.07)"/></pattern></defs>
  <rect width="1280" height="300" fill="#ece8df"/><rect width="1280" height="300" fill="url(#g)"/><rect x="40" y="60" width="272" height="196" rx="18" fill="#f6f3ed" stroke="rgba(20,20,20,0.22)"/>
    <text x="62" y="98" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13" fill="#ff5a1f" letter-spacing="1">01</text>
    <text x="62" y="134" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#141414">Add the repo</text><text x="62" y="172" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13.5" fill="#47443e">git clone …/glassboxapk</text><text x="62" y="194" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13.5" fill="#47443e">npm install</text><text x="62" y="234" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8a867c">Runs on your machine</text><path d="M318 158 h22 m-6 -6 l6 6 l-6 6" fill="none" stroke="#8a867c" stroke-width="1.6"/><rect x="348" y="60" width="272" height="196" rx="18" fill="#f6f3ed" stroke="rgba(20,20,20,0.22)"/>
    <text x="370" y="98" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13" fill="#ff5a1f" letter-spacing="1">02</text>
    <text x="370" y="134" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#141414">Open your agent</text><text x="370" y="172" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13.5" fill="#47443e">claude · codex · cursor</text><text x="370" y="234" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8a867c">It reads AGENTS.md</text><path d="M626 158 h22 m-6 -6 l6 6 l-6 6" fill="none" stroke="#8a867c" stroke-width="1.6"/><rect x="656" y="60" width="272" height="196" rx="18" fill="#0c1012" stroke="#0c1012"/>
    <text x="678" y="98" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13" fill="#ff5a1f" letter-spacing="1">03</text>
    <text x="678" y="134" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#e9ede9">Hand it the APK</text><text x="678" y="172" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13.5" fill="#e9ede9">› Analyze apks/app.apk</text><text x="678" y="234" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b9896">Decompile · trace · validate</text><path d="M934 158 h22 m-6 -6 l6 6 l-6 6" fill="none" stroke="#8a867c" stroke-width="1.6"/><rect x="964" y="60" width="272" height="196" rx="18" fill="#f6f3ed" stroke="rgba(20,20,20,0.22)"/>
    <text x="986" y="98" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13" fill="#ff5a1f" letter-spacing="1">04</text>
    <text x="986" y="134" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#141414">Watch and export</text><text x="986" y="172" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13.5" fill="#47443e">localhost:5173/app.html</text><text x="986" y="194" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13.5" fill="#47443e">#/report/app</text><text x="986" y="234" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8a867c">Animated flows · PPT · PDF</text><path d="M60 38 H1216" stroke="rgba(20,20,20,0.22)" stroke-dasharray="3 6"/>
  <g><circle r="8" fill="#ff5a1f" opacity="0.3"/><circle r="4.5" fill="#ff5a1f"/><animateMotion dur="5s" repeatCount="indefinite" path="M60 38 H1216"/></g>
</svg>
